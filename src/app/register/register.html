<div class="register-container">
  
  <div class="register-layout">
    
    <div class="info-section">
      <h1 class="info-title">Γίνε μέλος του <br><span class="highlight">Ysoft Tasks</span></h1>
      <p class="info-subtitle">
        Δημιούργησε έναν λογαριασμό δωρεάν και ξεκίνα να οργανώνεις τη ζωή σου σήμερα. 
      </p>
    </div>

    <div class="form-card">
      <h2 class="form-title">Δημιουργία Λογαριασμού</h2>
      
      <form #registerForm="ngForm" (ngSubmit)="onRegister()">
        
        <div class="form-group">
          <label>Όνομα <span class="required">*</span></label>
          <input type="text" name="first_name" [(ngModel)]="user.first_name" placeholder="π.χ. Γιάννης" required>
        </div>

        <div class="form-group">
          <label>Επώνυμο <span class="required">*</span></label>
          <input type="text" name="last_name" [(ngModel)]="user.last_name" placeholder="π.χ. Παπαδόπουλος" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Email <span class="required">*</span></label>
            <input type="email" name="email" [(ngModel)]="user.email" placeholder="name@example.com" required>
          </div>

        <div class="form-group">
        <label>Ημ. Γέννησης</label>
          <div class="date-wrapper">
            <input 
              matInput 
              [matDatepicker]="picker" 
              name="birth_date" 
              [(ngModel)]="user.birth_date" 
              placeholder="ΗΗ/ΜΜ/ΕΕΕΕ"
              (focus)="picker.open()">
            <mat-datepicker-toggle matSuffix [for]="picker" class="date-toggle"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </div>
        </div>
        </div>

        <div class="form-group">
          <label>Κωδικός Πρόσβασης <span class="required">*</span></label>
          <div class="password-wrapper">
            <input [type]="isPasswordVisible ? 'text' : 'password'" name="password" [(ngModel)]="user.password" placeholder="Πληκτρολογήστε κωδικό..." required>
            <button type="button" class="eye-btn" (click)="isPasswordVisible = !isPasswordVisible">
              <mat-icon>{{ isPasswordVisible ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
          </div>
        </div>

        <div class="required-note">
          <span class="required">*</span> Υποχρεωτικά πεδία
        </div>

        <div *ngIf="errorMessage()" class="alert error-alert">
          <mat-icon>error_outline</mat-icon>
          <span>{{ errorMessage() }}</span>
        </div>
        
        <div *ngIf="successMessage()" class="alert success-alert">
          <mat-icon>check_circle_outline</mat-icon>
          <span>{{ successMessage() }}</span>
        </div>

        <button type="submit" class="submit-btn" [disabled]="registerForm.invalid">Εγγραφή</button>
        
        <div class="form-footer">
          Έχεις ήδη λογαριασμό; <a routerLink="/login">Σύνδεση</a>
        </div>

      </form>
    </div>

  </div>
</div>
