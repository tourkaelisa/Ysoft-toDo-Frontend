<div class="auth-container">

  <div class="auth-layout">

    <div class="info-section">
      <h1 class="info-title">Ξέχασες τον <br><span class="highlight">κωδικό σου;</span></h1>
      <p class="info-subtitle">
        Μην ανησυχείς. Δώσε το email σου και θα σου στείλουμε έναν σύνδεσμο για να ορίσεις νέο κωδικό.
      </p>
    </div>

    <div class="form-card">
      <h2 class="form-title">Επαναφορά Κωδικού</h2>

      <form #forgotForm="ngForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" [(ngModel)]="email" placeholder="name@example.com" required>
        </div>

        <div *ngIf="errorMessage()" class="alert error-alert">
          <mat-icon>error_outline</mat-icon>
          <span>{{ errorMessage() }}</span>
        </div>

        <div *ngIf="successMessage()" class="alert success-alert">
          <mat-icon>mark_email_read</mat-icon>
          <span>{{ successMessage() }}</span>
        </div>

        <button type="submit" class="submit-btn" [disabled]="forgotForm.invalid || isLoading()">
          {{ isLoading() ? 'Αποστολή...' : 'Αποστολή συνδέσμου' }}
        </button>

        <div class="form-footer">
          Θυμήθηκες τον κωδικό σου; <a routerLink="/login">Σύνδεση</a>
        </div>
      </form>
    </div>

  </div>
</div>
