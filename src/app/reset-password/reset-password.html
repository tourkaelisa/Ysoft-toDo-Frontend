<div class="auth-container">

  <div class="auth-layout">

    <div class="info-section">
      <h1 class="info-title">Όρισε τον <br><span class="highlight">νέο σου κωδικό</span></h1>
      <p class="info-subtitle">
        Σχεδόν τελείωσες! Διάλεξε έναν νέο, ασφαλή κωδικό για να ξανασυνδεθείς στο Ysoft Tasks.
      </p>
    </div>

    <div class="form-card">
      <h2 class="form-title">Νέος Κωδικός</h2>

      <!-- ΦΟΡΜΑ -->
      <form #resetForm="ngForm" (ngSubmit)="onSubmit()" *ngIf="!isDone()">

        <div class="form-group">
          <label>Νέος Κωδικός</label>
          <div class="password-wrapper">
            <input [type]="isPasswordVisible ? 'text' : 'password'" name="newPassword" [(ngModel)]="newPassword" placeholder="Τουλάχιστον {{ minLength }} χαρακτήρες..." required>
            <button type="button" class="eye-btn" (click)="isPasswordVisible = !isPasswordVisible">
              <mat-icon>{{ isPasswordVisible ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label>Επιβεβαίωση Κωδικού</label>
          <div class="password-wrapper">
            <input [type]="isConfirmVisible ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Επαναλάβετε τον κωδικό..." required>
            <button type="button" class="eye-btn" (click)="isConfirmVisible = !isConfirmVisible">
              <mat-icon>{{ isConfirmVisible ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
          </div>
        </div>

        <div *ngIf="errorMessage()" class="alert error-alert">
          <mat-icon>error_outline</mat-icon>
          <span>{{ errorMessage() }}</span>
        </div>

        <button type="submit" class="submit-btn" [disabled]="resetForm.invalid || isLoading() || !token">
          {{ isLoading() ? 'Αποθήκευση...' : 'Αλλαγή κωδικού' }}
        </button>

        <div class="form-footer">
          <a routerLink="/login">Επιστροφή στη σύνδεση</a>
        </div>
      </form>

      <!-- ΜΗΝΥΜΑ ΕΠΙΤΥΧΙΑΣ -->
      <div *ngIf="isDone()" class="success-box">
        <div class="success-badge">
          <mat-icon>check</mat-icon>
        </div>
        <h3 class="success-title">{{ successMessage() }}</h3>
        <p class="redirect-note">
          <mat-icon class="spin">autorenew</mat-icon>
          <span>Μεταφέρεστε στη σελίδα σύνδεσης...</span>
        </p>
        <a routerLink="/login" class="submit-btn link-btn">Σύνδεση τώρα</a>
      </div>
    </div>

  </div>
</div>
